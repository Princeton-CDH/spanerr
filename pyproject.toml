[project]
name = "spanerr"
version = "0.1.0"
description = "Python library for text span evaluation"
readme = "README.md"
authors = [
    {name = "The Center for Digital Humanities at Princeton", email = "cdhdevteam@princeton.edu"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage[toml]",
]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
    "spanerr[test]",
]

[dependency-groups]
dev = [
    "spanerr[dev]",
]

[tool.uv]
exclude-newer= "1 week"

[tool.pytest]
minversion = "9"
strict = true
addopts = ["-ra"]
testpaths = ["tests"]
log_level = "INFO"
# Print the first occurrence of matching warnings for each location
filterwarnings = ["default"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true   # Helpful for debugging
exclude_lines = [
    "# pragma: no cover",
    # skip command-line configuration for main method on scripts
    "if __name__ == .__main__.:"
]

[tool.coverage.html]
directory = "coverage_html_report"


[tool.ruff.lint]
# Include these rules in addition to ruff's defaults
extend-select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "I",    #isort
  "NPY",  # numpy-specific rules
  "PERF", # perflint
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
]
# Can use to ignore specific rules within above selection
ignore = []

[tool.mdformat]
number = true
wrap = "keep"
end_of_line = "lf"
